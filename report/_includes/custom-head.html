
<!-- MathJax configuration -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    },
    options: {
      skipHtmlTags: [
        'script', 'noscript', 'style',
        'textarea', 'pre', 'code'
      ]
    }
  };
</script>

  defer
  id="MathJax-script"
